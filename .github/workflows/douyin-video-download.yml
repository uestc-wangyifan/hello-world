name: Download supplied Douyin video
on:
  push:
    branches:
      - chatgpt-douyin-dl-7691231256889421641
    paths:
      - .github/workflows/douyin-video-download.yml
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'playwright>=1.40'
          python -m playwright install --with-deps chromium
      - name: Download one public video
        run: |
          curl --fail --location --silent --show-error --output dydl.py https://raw.githubusercontent.com/xiaoke949/douyin-guest-dl/main/dydl.py
          python dydl.py 7691231256889421641 --browser chromium --no-json -o videos
          test -s videos/7691231256889421641.mp4
          file videos/7691231256889421641.mp4
      - name: Make MP4 available
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-7691231256889421641
          path: videos/7691231256889421641.mp4
          if-no-files-found: error
          retention-days: 1

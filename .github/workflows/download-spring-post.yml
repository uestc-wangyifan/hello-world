name: Download Douyin spring post
on:
  push:
    branches: [chatgpt-douyin-spring-20261026]
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests mutagen
      - name: Fetch and verify spring post
        run: python scripts/douyin_fast.py "https://v.douyin.com/NJ_DRKMVA_Y/" --mode fast --expect-title "春天是播种的季节"
      - name: Upload media
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spring-douyin-media
          path: output-fast/*
          if-no-files-found: warn
          retention-days: 2

name: Download Douyin spring post
on:
  push:
    branches: [chatgpt-douyin-spring-20261026]
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests mutagen
      - name: Fetch image post and create ZIP
        run: python scripts/download_spring_images.py
      - name: Upload media
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spring-douyin-media
          path: output-fast/*
          if-no-files-found: warn
          retention-days: 2

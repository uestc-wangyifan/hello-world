name: Fetch linked Douyin video
on:
  push:
    branches:
      - chatgpt-douyin-20261026
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests
      - run: python scripts/resolve_douyin.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: douyin-media
          path: output/*
          if-no-files-found: warn
          retention-days: 2

name: Download supplied Douyin video wbHHCvdaXw8
on:
  push:
    branches:
      - chatgpt-douyin-dl-wbHHCvdaXw8
    paths:
      - .github/workflows/douyin-video-download-new.yml
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: python -m pip install --upgrade yt-dlp requests
      - name: Download video with alternate extractors
        shell: bash
        run: |
          mkdir -p videos
          yt-dlp --no-playlist --socket-timeout 15 --retries 1 -o 'videos/%(id)s.%(ext)s' 'https://www.douyin.com/video/7707940295400903291' || true
          if ! compgen -G "videos/*.mp4" > /dev/null; then
            python - <<'PY'
          import requests, os, json
          u='https://www.tikwm.com/api/'
          try:
              r=requests.get(u,params={'url':'https://www.douyin.com/video/7707940295400903291','hd':'1'},headers={'User-Agent':'Mozilla/5.0'},timeout=30)
              print('API',r.status_code,r.text[:1300])
              j=r.json()
              d=j.get('data') or {}
              v=d.get('hdplay') or d.get('play')
              if v:
                  if v.startswith('/'): v='https://www.tikwm.com'+v
                  t=requests.get(v,timeout=60,headers={'User-Agent':'Mozilla/5.0'})
                  t.raise_for_status()
                  open('videos/7707940295400903291.mp4','wb').write(t.content)
          except Exception as e: print(type(e).__name__,str(e))
          PY
          fi
          ls -lh videos
          test "$(find videos -maxdepth 1 -name '*.mp4' -size +100k | wc -l)" -ge 1
          file videos/*.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 videos/*.mp4
      - name: Make MP4 available
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-7707940295400903291
          path: videos/*.mp4
          if-no-files-found: error
          retention-days: 1

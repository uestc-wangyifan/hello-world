name: Download supplied Douyin video wbHHCvdaXw8
on:
  push:
    branches:
      - chatgpt-douyin-dl-wbHHCvdaXw8
    paths:
      - .github/workflows/douyin-video-download-new.yml
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser environment
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Download with browser session
        run: |
          mkdir -p videos
          cat > get_video.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  ctx=await browser.new_context(locale='zh-CN',user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36')
                  page=await ctx.new_page()
                  await page.goto('https://www.douyin.com/video/7707940295400903291',wait_until='domcontentloaded',timeout=60000)
                  await page.wait_for_timeout(7000)
                  print('PAGE',page.url, 'TITLE',await page.title(),flush=True)
                  result=None
                  for attempt in range(6):
                      try:
                          await page.wait_for_load_state('domcontentloaded', timeout=15000)
                          result=await page.evaluate("""async () => {
                      const u='/aweme/v1/web/aweme/detail/?aweme_id=7707940295400903291&device_platform=webapp&aid=6383';
                      const r=await fetch(u, {credentials:'include',headers:{Accept:'application/json'}});
                      const txt=await r.text();
                      try {
                          const j=JSON.parse(txt); const a=j.aweme_detail;
                          return {status:r.status, excerpt:txt.slice(0,400), urls:a?.video?.play_addr?.url_list||a?.video?.play_addr_h264?.url_list||[]};
                      } catch(e) {return {status:r.status, excerpt:txt.slice(0,400),urls:[]}}
                  }""")
                          break
                      except Exception as e:
                          print('EVAL_RETRY',attempt,str(e)[:180],flush=True)
                          await page.wait_for_timeout(1500)
                  if result is None: return
                  print('DETAIL',str(result)[:1200],flush=True)
                  for u in result['urls']:
                      try:
                          r=await ctx.request.get(u,headers={'Referer':'https://www.douyin.com/'},timeout=45000)
                          b=await r.body()
                          print('VIDEO',r.status,len(b),r.headers.get('content-type'),flush=True)
                          if r.ok and len(b)>100000 and ('mp4' in r.headers.get('content-type','') or b[4:8]==b'ftyp'):
                              open('videos/7707940295400903291.mp4','wb').write(b)
                              break
                      except Exception as e:print('ERR',str(e),flush=True)
                  await browser.close()
          asyncio.run(main())
          PY
          python get_video.py
          ls -lh videos
          test -s videos/7707940295400903291.mp4
          file videos/*.mp4
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: douyin-7707940295400903291
          path: videos/*.mp4
          retention-days: 1

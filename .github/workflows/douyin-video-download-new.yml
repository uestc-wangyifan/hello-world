name: Download supplied Douyin video wbHHCvdaXw8
on:
  push:
    branches:
      - chatgpt-douyin-dl-wbHHCvdaXw8
    paths:
      - .github/workflows/douyin-video-download-new.yml
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'playwright>=1.40'
          python -m playwright install --with-deps chromium
      - name: Download one public video
        run: |
          curl --fail --location --silent --show-error --output dydl.py https://raw.githubusercontent.com/xiaoke949/douyin-guest-dl/main/dydl.py
          python dydl.py 'https://v.douyin.com/wbHHCvdaXw8/' --browser chromium --no-json -o videos
          test "$(find videos -maxdepth 1 -name '*.mp4' -type f | wc -l)" -eq 1
          file videos/*.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 videos/*.mp4
      - name: Make MP4 available
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-wbHHCvdaXw8
          path: videos/*.mp4
          if-no-files-found: error
          retention-days: 1
